name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: icons-master.exe
          - target: x86_64-apple-darwin
            os: macos-13
            binary: icons-master
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: icons-master
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: icons-master
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: icons-master

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross (Linux ARM only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: icons-master-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/icons-master-x86_64-pc-windows-msvc/icons-master.exe artifacts/icons-master-x86_64-pc-windows-msvc/icons-master-windows-x64.exe
          mv artifacts/icons-master-x86_64-apple-darwin/icons-master artifacts/icons-master-x86_64-apple-darwin/icons-master-darwin-x64
          mv artifacts/icons-master-aarch64-apple-darwin/icons-master artifacts/icons-master-aarch64-apple-darwin/icons-master-darwin-arm64
          mv artifacts/icons-master-x86_64-unknown-linux-gnu/icons-master artifacts/icons-master-x86_64-unknown-linux-gnu/icons-master-linux-x64
          mv artifacts/icons-master-aarch64-unknown-linux-gnu/icons-master artifacts/icons-master-aarch64-unknown-linux-gnu/icons-master-linux-arm64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
