name: Tag

on:
  push:
    branches: [master]

jobs:
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read version from package.json
        id: version
        run: echo "version=v$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create tag if it doesn't exist
        run: |
          git tag ${{ steps.version.outputs.version }} || echo "Tag already exists, skipping"
          git push origin ${{ steps.version.outputs.version }} || echo "Tag already pushed, skipping"
